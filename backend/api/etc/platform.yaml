Name: dexwallet-api
Environment: local
Mode: dev
Host: 127.0.0.1
Port: 8888
Log:
  ServiceName: dexwallet-api
  Mode: console
  Encoding: json
  Level: info
Timeout: 5000
DependencyTimeout: 3s
ProbeTimeout: 1s
ProbeInterval: 5s
ProbeFreshness: 15s
ShutdownTimeout: 30s
MaxConns: 1000
MaxBytes: 1048576
# Framework middleware remains enabled except features not used by this JSON API.
Middlewares:
  Breaker: false
  Shedding: false
  Gunzip: false
Telemetry:
  Sampler: 0
Shutdown:
  WrapUpTime: 1s
  WaitTime: 37s
MySQL:
  DSN: ""
  MaxOpen: 20
  MaxIdle: 5
Redis:
  Enabled: true
  Required: false
  Address: 127.0.0.1:6379
  DB: 0
RocketMQ:
  Enabled: true
  Required: false
  NameServers:
    - 127.0.0.1:9876
  BrokerAddress: 127.0.0.1:10911

# Public login/JWT requires explicit Auth and Session configuration.
# See docs/engineering/用户鉴权.md; secrets are injected from environment variables.

# Backoffice is opt-in: add Backoffice: {} and configure Auth/SMTP.
# DEXWALLET_ADMIN_TOKEN_SECRET and DEXWALLET_MERCHANT_TOKEN_SECRET must be independent.
# See docs/engineering/后台鉴权.md for super and migration instructions.
